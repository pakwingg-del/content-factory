name: Backfill short meta descriptions

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site id or all"
        required: true
        default: all
        type: choice
        options:
          - all
          - viralnn
          - billcutdaily
          - gadgetpulseus
          - popspilldaily
      dry_run:
        description: "Dry run (no D1 writes / IndexNow)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: "Max rows per site"
        required: true
        default: "5000"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Backfill meta + IndexNow
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INDEXNOW_KEY_VIRALNN: ${{ secrets.INDEXNOW_KEY_VIRALNN }}
          CF_ACCOUNT_BILLCUTDAILY: ${{ secrets.CF_ACCOUNT_BILLCUTDAILY }}
          CF_DB_BILLCUTDAILY: ${{ secrets.CF_DB_BILLCUTDAILY }}
          CF_TOKEN_BILLCUTDAILY: ${{ secrets.CF_TOKEN_BILLCUTDAILY }}
          INDEXNOW_KEY_BILLCUTDAILY: ${{ secrets.INDEXNOW_KEY_BILLCUTDAILY }}
          CF_ACCOUNT_GADGETPULSEUS: ${{ secrets.CF_ACCOUNT_GADGETPULSEUS }}
          CF_DB_GADGETPULSEUS: ${{ secrets.CF_DB_GADGETPULSEUS }}
          CF_TOKEN_GADGETPULSEUS: ${{ secrets.CF_TOKEN_GADGETPULSEUS }}
          INDEXNOW_KEY_GADGETPULSEUS: ${{ secrets.INDEXNOW_KEY_GADGETPULSEUS }}
          CF_ACCOUNT_POPSPILLDAILY: ${{ secrets.CF_ACCOUNT_POPSPILLDAILY }}
          CF_DB_POPSPILLDAILY: ${{ secrets.CF_DB_POPSPILLDAILY }}
          CF_TOKEN_POPSPILLDAILY: ${{ secrets.CF_TOKEN_POPSPILLDAILY }}
          INDEXNOW_KEY_POPSPILLDAILY: ${{ secrets.INDEXNOW_KEY_POPSPILLDAILY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          if [ "${{ inputs.dry_run }}" != "true" ]; then EXTRA="$EXTRA --submit-indexnow"; fi
          python backfill_meta.py --site "${{ inputs.site }}" --limit "${{ inputs.limit }}" $EXTRA
