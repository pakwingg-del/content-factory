name: Generate Gadget Pulse US

on:
  workflow_dispatch:           # GitHub 網頁手動 Run
  repository_dispatch:
    types: "run_gadgetpulseus"  # 外部 API 觸發（你而家用緊呢種）

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests openai google-auth google-api-python-client

      - name: Generate Content + D1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_GADGETPULSEUS: ${{ secrets.CF_ACCOUNT_GADGETPULSEUS }}
          CF_DB_GADGETPULSEUS: ${{ secrets.CF_DB_GADGETPULSEUS }}
          CF_TOKEN_GADGETPULSEUS: ${{ secrets.CF_TOKEN_GADGETPULSEUS }}
        run: python generator.py --site gadgetpulseus
