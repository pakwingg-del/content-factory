name: Generate PopSpill Daily

on:
  workflow_dispatch:           # GitHub 網頁手動 Run
  repository_dispatch:
    types: "run_popspilldaily"  # 外部 API 觸發（你而家用緊呢種）

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests openai google-auth google-api-python-client

      - name: Generate Content + D1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_POPSPILLDAILY: ${{ secrets.CF_ACCOUNT_POPSPILLDAILY }}
          CF_DB_POPSPILLDAILY: ${{ secrets.CF_DB_POPSPILLDAILY }}
          CF_TOKEN_POPSPILLDAILY: ${{ secrets.CF_TOKEN_POPSPILLDAILY }}
        run: python generator.py --site popspilldaily

      - name: Submit IndexNow
        env:
          CF_ACCOUNT_POPSPILLDAILY: ${{ secrets.CF_ACCOUNT_POPSPILLDAILY }}
          CF_DB_POPSPILLDAILY: ${{ secrets.CF_DB_POPSPILLDAILY }}
          CF_TOKEN_POPSPILLDAILY: ${{ secrets.CF_TOKEN_POPSPILLDAILY }}
          INDEXNOW_KEY_POPSPILLDAILY: ${{ secrets.INDEXNOW_KEY_POPSPILLDAILY }}
        run: python submit_indexing.py --site popspilldaily --from-last-run
