name: Generate BillCut Daily

on:
  schedule:
    - cron: '25 14,16,18,20,22 * * *'   # 北京 22:25 / 00:25 / 02:25 / 04:25 / 06:25
  workflow_dispatch:
  repository_dispatch:
    types: [run_billcutdaily]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests openai google-auth google-api-python-client

      - name: Generate Content + D1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_BILLCUTDAILY: ${{ secrets.CF_ACCOUNT_BILLCUTDAILY }}
          CF_DB_BILLCUTDAILY: ${{ secrets.CF_DB_BILLCUTDAILY }}
          CF_TOKEN_BILLCUTDAILY: ${{ secrets.CF_TOKEN_BILLCUTDAILY }}
        run: python generator.py --site billcutdaily
